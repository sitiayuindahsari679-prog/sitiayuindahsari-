<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Aritmatika</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="card shadow mx-auto" style="max-width: 700px;">

      <div class="card-header bg-primary text-white text-center py-3">
        <h2 class="mb-1">Kalkulator Aritmatika</h2>
        <div>Siti ayu indah sari- NIM. 262302015</div>
      </div>

      <div class="card-body p-4">
        <div class="mb-3">
          <label class="form-label">Angka Pertama</label>
          <input type="number" id="bilangan1" class="form-control form-control-lg">
        </div>

        <div class="mb-3">
          <label class="form-label">Angka Kedua</label>
          <input type="number" id="bilangan2" class="form-control form-control-lg">
        </div>

        <div class="mb-3">
          <label class="form-label">Pilih Operator</label>
          <select id="operator" class="form-select form-select-lg">
            <option value="+">Penjumlahan (+)</option>
            <option value="-">Pengurangan (-)</option>
            <option value="*">Perkalian (×)</option>
            <option value="/">Pembagian (÷)</option>
            <option value="%">Modulus (%)</option>
            <option value="**">Pangkat (**)</option>
          </select>
        </div>

        <button class="btn btn-primary btn-lg w-100" onclick="hitung()">Hitung</button>

        <div class="bg-dark text-white text-center rounded p-4 mt-4">
          <div class="text-uppercase">Hasil Perhitungan</div>
          <div id="hasil" class="display-4 fw-bold">0</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    function hitung() {
      var a = parseFloat(document.getElementById("bilangan1").value);
      var b = parseFloat(document.getElementById("bilangan2").value);
      var op = document.getElementById("operator").value;
      var hasil;

      if (isNaN(a) || isNaN(b)) {
        hasil = "Isi angka dulu";
      } else if (op === "+") {
        hasil = a + b;
      } else if (op === "-") {
        hasil = a - b;
      } else if (op === "*") {
        hasil = a * b;
      } else if (op === "/") {
        hasil = (b === 0) ? "Tidak bisa dibagi nol" : a / b;
      } else if (op === "%") {
        hasil = (b === 0) ? "Tidak bisa dibagi nol" : a % b;
      } else if (op === "**") {
        hasil = a ** b;
      }

      document.getElementById("hasil").innerHTML = hasil;
    }
  </script>

</body>
  </html>
